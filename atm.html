<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATM Locator - American Bank United</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/opay.css">
  <link rel="icon" href="assets/abu-logo.png" type="image/png">
  <style>
    :root{--atm-navy:#111827;--atm-light:#26364a;--atm-border:#dbe3ec}
    body{background:#f8fafc;color:#0f172a}.atm-page{min-height:100vh;padding:0 16px 40px}.atm-shell{width:min(100%,760px);margin:0 auto}.atm-topbar{display:flex;justify-content:flex-end;margin-bottom:12px}.atm-close{width:40px;height:40px;border:1px solid var(--atm-border);border-radius:999px;background:#fff;color:#64748b;box-shadow:0 4px 12px rgba(15,23,42,.08)}.atm-kicker{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.atm-heading h1{font-size:28px;line-height:1.1;margin:4px 0 7px}.atm-heading p{font-size:14px;color:#64748b;margin:0 0 18px}.atm-card{background:#fff;border:1px solid var(--atm-border);border-radius:18px;padding:14px;box-shadow:0 10px 28px rgba(15,23,42,.06)}.atm-status{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:13px;margin-bottom:12px}.atm-status i{color:var(--atm-navy)}.atm-status.error{background:#fff1f2;color:#9f1239}.atm-status.error i{color:#be123c}.atm-map{height:360px;border-radius:13px;overflow:hidden;background:#e2e8f0}.atm-actions{display:flex;gap:8px;margin-top:12px}.atm-button{flex:1;border:0;border-radius:10px;padding:12px;background:var(--atm-navy);color:#fff;font-weight:700}.atm-button.secondary{background:#f1f5f9;color:#334155;border:1px solid var(--atm-border)}.atm-results{margin-top:16px}.atm-results h2{font-size:17px;margin:0 0 10px}.atm-list{display:grid;gap:8px}.atm-item{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--atm-border);border-radius:12px;background:#fff}.atm-marker{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:linear-gradient(135deg,var(--atm-navy),var(--atm-light));color:#fff;display:flex;align-items:center;justify-content:center}.atm-item strong{font-size:14px}.atm-item p{margin:3px 0 0;color:#64748b;font-size:12px}.atm-distance{margin-left:auto;color:#475569;font-size:12px;font-weight:700;white-space:nowrap}.atm-empty{text-align:center;padding:18px;color:#64748b;font-size:13px;border:1px dashed #cbd5e1;border-radius:12px}.leaflet-control-attribution{font-size:9px}
    @media(max-width:520px){.atm-page{padding:16px 12px 30px}.atm-map{height:300px}.atm-actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="atm-page"><div class="atm-shell">
    <div class="atm-topbar"><button type="button" class="atm-close" onclick="window.history.length > 1 ? history.back() : location.href='dashboard.html'" aria-label="Close and return" title="Close"><i class="fas fa-xmark"></i></button></div>
    <section class="atm-heading"><div class="atm-kicker">ABU Tools</div><h1>Find an ATM</h1><p>Allow location access to find nearby cash machines and plan your route.</p></section>
    <section class="atm-card">
      <div id="atmStatus" class="atm-status"><i class="fas fa-location-crosshairs"></i><span>Requesting your location...</span></div>
      <div id="atmMap" class="atm-map" aria-label="Map showing nearby ATMs"></div>
      <div class="atm-actions"><button type="button" id="locateButton" class="atm-button"><i class="fas fa-location-crosshairs mr-2"></i>Use my location</button><button type="button" id="refreshButton" class="atm-button secondary"><i class="fas fa-rotate mr-2"></i>Refresh ATMs</button></div>
      <section class="atm-results"><h2>Nearest ATMs</h2><div id="atmList" class="atm-list"><div class="atm-empty">Waiting for your location...</div></div></section>
    </section>
  </div></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    (() => {
      const statusEl=document.getElementById('atmStatus'), mapEl=document.getElementById('atmMap'), listEl=document.getElementById('atmList');
      const locateButton=document.getElementById('locateButton'), refreshButton=document.getElementById('refreshButton');
      let map=null, userMarker=null, userLocation=null, atmMarkers=[];
      const setStatus=(message,error=false)=>{statusEl.classList.toggle('error',error);statusEl.innerHTML=`<i class="fas fa-${error?'triangle-exclamation':'location-crosshairs'}"></i><span>${message}</span>`};
      const distance=(a,b)=>{const r=6371,lat=(b.lat-a.lat)*Math.PI/180,lon=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(lat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lon/2)**2;return r*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));};
      function setupMap(lat,lon){ if(!map){map=L.map(mapEl,{zoomControl:true}).setView([lat,lon],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);}else map.setView([lat,lon],14); if(userMarker) userMarker.remove(); userMarker=L.circleMarker([lat,lon],{radius:8,color:'#111827',weight:3,fillColor:'#26364a',fillOpacity:1}).addTo(map).bindPopup('Your location');}
      async function findAtms(){if(!userLocation){requestLocation();return}setStatus('Finding nearby ATMs...');listEl.innerHTML='<div class="atm-empty">Searching the map...</div>';const query=`[out:json][timeout:20];node[amenity=atm](around:5000,${userLocation.lat},${userLocation.lon});out body;`;try{const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});if(!response.ok)throw new Error('ATM map service unavailable');const data=await response.json();const atms=(data.elements||[]).map(item=>({lat:item.lat,lon:item.lon,name:item.tags?.name||item.tags?.operator||'ATM',address:[item.tags?.['addr:housenumber'],item.tags?.['addr:street'],item.tags?.['addr:city']].filter(Boolean).join(' ')||'Location shown on map'})).map(item=>({...item,distance:distance(userLocation,item)})).sort((a,b)=>a.distance-b.distance).slice(0,12);atmMarkers.forEach(marker=>marker.remove());atmMarkers=[];atms.forEach((atm,index)=>{const marker=L.marker([atm.lat,atm.lon]).addTo(map).bindPopup(`<strong>${atm.name}</strong><br>${atm.distance.toFixed(1)} km away`);atmMarkers.push(marker);if(index===0)map.setView([atm.lat,atm.lon],14)});listEl.innerHTML=atms.length?atms.map((atm,index)=>`<button type="button" class="atm-item" data-lat="${atm.lat}" data-lon="${atm.lon}"><span class="atm-marker"><i class="fas fa-building-columns"></i></span><span><strong>${atm.name}</strong><p>${atm.address}</p></span><span class="atm-distance">${atm.distance<1?(atm.distance*1000).toFixed(0)+' m':atm.distance.toFixed(1)+' km'}</span></button>`).join(''):'<div class="atm-empty">No ATMs were found within 5 km.</div>';listEl.querySelectorAll('.atm-item').forEach(item=>item.addEventListener('click',()=>map.setView([Number(item.dataset.lat),Number(item.dataset.lon)],17)));setStatus(atms.length?`${atms.length} nearby ATM${atms.length===1?'':'s'} found`:'No nearby ATMs found');}catch(error){setStatus('Unable to load ATM locations. Try again shortly.',true);listEl.innerHTML='<div class="atm-empty">The map service could not return nearby ATMs.</div>';}}
      function requestLocation(){if(!navigator.geolocation){setStatus('Location is not supported by this browser.',true);return}setStatus('Requesting location permission...');navigator.geolocation.getCurrentPosition(position=>{userLocation={lat:position.coords.latitude,lon:position.coords.longitude};setupMap(userLocation.lat,userLocation.lon);findAtms();},error=>{const message=error.code===1?'Location permission was denied. Allow access to find nearby ATMs.':'Unable to determine your location. Try again.';setStatus(message,true);listEl.innerHTML='<div class="atm-empty">Location access is required to search nearby ATMs.</div>';},{enableHighAccuracy:true,timeout:15000,maximumAge:300000});}
      locateButton.addEventListener('click',requestLocation);refreshButton.addEventListener('click',findAtms);requestLocation();
    })();
  </script>
</body>
</html>

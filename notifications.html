<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script> if(!localStorage.getItem('authToken')) window.location.href='index.html'; </script>
  <title>Notifications - American Bank United</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/opay.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="opay-ui">
  <main class="max-w-md mx-auto p-4 pb-32">
    <h1 class="text-lg font-semibold mb-2">Notifications</h1>
    <p class="text-sm text-slate-600">Account activity, transfers, deposits, and withdrawals.</p>
    <div id="notificationsList" class="mt-4 space-y-3"></div>
  </main>
  <script src="js/api.js?v=20260914.4"></script>
  <script src="js/auth.js?v=20260914.4"></script>
  <script src="js/utils.js?v=20260914.4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const list = document.getElementById('notificationsList');
      try {
        const notifications = await notificationsAPI.getAll();
        list.innerHTML = notifications.length ? notifications.map(item => `
          <article class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center"><i class="fas fa-bell"></i></div>
              <div class="min-w-0 flex-1">
                <div class="font-medium text-slate-900">${item.title}</div>
                <div class="text-sm text-slate-600 mt-1">${item.message}</div>
                <div class="text-xs text-slate-400 mt-2">${formatDate(item.createdAt)}${item.receiptId ? ` · ${item.receiptId}` : ''}</div>
              </div>
            </div>
          </article>
        `).join('') : '<div class="bg-white border border-slate-200 rounded-xl p-6 text-sm text-slate-500">No account activity yet.</div>';
      } catch (error) {
        list.innerHTML = '<div class="text-sm text-rose-600">Unable to load notifications.</div>';
      }
    });
  </script>
</body>
</html>

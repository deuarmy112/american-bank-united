<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>if (!localStorage.getItem('authToken')) localStorage.setItem('authToken', 'guest-token');</script>
  <title>Card PIN - American Bank United</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/opay.css">
  <link rel="icon" href="assets/abu-logo.png" type="image/png">
  <style>
    body{background:#f8fafc;color:#0f172a}.pin-page{min-height:100vh;padding:20px 16px 40px}.pin-shell{width:min(100%,560px);margin:0 auto}.pin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pin-back{color:#475569;text-decoration:none;font-size:13px;font-weight:700}.pin-close{width:40px;height:40px;border:1px solid #dbe3ec;border-radius:999px;background:#fff;color:#64748b}.pin-kicker{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase}.pin-heading h1{font-size:27px;line-height:1.15;margin:4px 0 7px}.pin-heading p{font-size:14px;color:#64748b;margin:0 0 18px}.pin-card{padding:20px;border:1px solid #dbe3ec;border-radius:12px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}.pin-label{display:block;margin:14px 0 6px;color:#475569;font-size:12px;font-weight:700}.pin-input,.pin-select{width:100%;min-height:46px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a}.pin-code{text-align:center;font-size:20px;font-weight:700;letter-spacing:4px}.pin-submit,.pin-secondary{width:100%;min-height:46px;margin-top:18px;border-radius:8px;font-weight:700}.pin-submit{border:0;background:#111827;color:#fff}.pin-secondary{margin-top:10px;border:1px solid #dbe3ec;background:#fff;color:#334155}.pin-submit:disabled,.pin-secondary:disabled{opacity:.55}.pin-status{min-height:20px;margin:14px 0 0;color:#475569;font-size:13px}.pin-status.error{color:#b91c1c}.pin-status.success{color:#15803d}.pin-note{margin:16px 0 0;color:#64748b;font-size:12px;line-height:1.5}
    @media(max-width:480px){.pin-page{padding:16px 12px 32px}}
  </style>
</head>
<body>
  <main class="pin-page"><div class="pin-shell">
    <div class="pin-topbar"><a class="pin-back" href="security.html"><i class="fas fa-arrow-left"></i> Security</a><button class="pin-close" type="button" onclick="location.href='security.html'" aria-label="Return to security settings" title="Return"><i class="fas fa-xmark"></i></button></div>
    <section class="pin-heading"><div class="pin-kicker">Email verification required</div><h1 id="pinTitle">Set card PIN</h1><p id="pinDescription">Choose a card and create a four-digit PIN. We will verify your email before saving it.</p></section>
    <section class="pin-card">
      <label class="pin-label" for="cardSelect">Card</label>
      <select id="cardSelect" class="pin-select"><option value="">Loading cards...</option></select>
      <button id="sendCode" class="pin-submit" type="button" disabled><i class="fas fa-envelope mr-2"></i>Send email code</button>
      <form id="cardPinForm" hidden>
        <label class="pin-label" for="verificationCode">Six-digit email code</label>
        <input id="verificationCode" class="pin-input pin-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000">
        <label class="pin-label" for="newCardPin">New four-digit card PIN</label>
        <input id="newCardPin" class="pin-input pin-code" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" required placeholder="4 digits">
        <label class="pin-label" for="confirmCardPin">Confirm card PIN</label>
        <input id="confirmCardPin" class="pin-input pin-code" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" required placeholder="4 digits">
        <button id="saveCardPin" class="pin-submit" type="submit">Save card PIN</button>
        <button id="resendCode" class="pin-secondary" type="button">Send a new code</button>
      </form>
      <p id="pinStatus" class="pin-status" role="status" aria-live="polite"></p>
      <p class="pin-note"><i class="fas fa-lock"></i> Your PIN is stored securely and can be reset here at any time. Never share it or your email verification code.</p>
    </section>
  </div></main>
  <script src="js/api.js?v=20261010.3"></script>
  <script src="js/card-pin-security.js?v=20261010.2"></script>
</body>
</html>

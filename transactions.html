<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - American Bank United</title>
    <link rel="icon" href="assets/abu-logo.png" type="image/png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/opay.css">
    <style>
        .compact-abu-receipt { font-family: Arial, sans-serif; color: #172033; background: #fff; border-top: 5px solid #0b2c5f; }
        .compact-abu-receipt .receipt-amount { color: #0b2c5f; font-size: 2.25rem; font-weight: 800; letter-spacing: 0.04em; }
        .compact-abu-receipt .receipt-success { color: #0b2c5f; font-weight: 700; font-size: 1.35rem; }
        .compact-abu-receipt .receipt-dashed { border-top: 1px dashed #cbd5e1; }
        .compact-abu-receipt .receipt-section-title { color: #0b2c5f; border-bottom: 1px solid #334155; padding-bottom: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .compact-abu-receipt .receipt-row { display: flex; justify-content: space-between; gap: 18px; padding: 5px 0; font-size: 0.75rem; }
        .compact-abu-receipt .receipt-row > span:first-child { color: #64748b; }
        .compact-abu-receipt .receipt-row > span:last-child, .compact-abu-receipt .receipt-row strong { text-align: right; overflow-wrap: anywhere; }
        .compact-abu-receipt .receipt-disclaimer { border-top: 1px solid #cbd5e1; color: #64748b; font-size: 0.65rem; line-height: 1.45; }
    </style>
    <script>
        if (!localStorage.getItem('authToken')) {
            localStorage.setItem('authToken', 'guest-token');
        }
    </script>
</head>
<body class="bg-slate-50">
    <main class="max-w-6xl mx-auto bg-white min-h-screen pb-20 px-4">
        <!-- Header -->
        <div class="text-white rounded-lg p-5 sm:p-6 mb-6" style="background: linear-gradient(135deg, var(--abu-silver), var(--abu-grey) 55%, var(--abu-gold));">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold mb-2">Transaction History</h1>
                    <p class="text-white/85">View and manage all your banking activities</p>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fas fa-history text-3xl sm:text-4xl text-white/75"></i>
                    <button type="button" onclick="if (document.referrer && document.referrer.startsWith(location.origin)) history.back(); else location.href = 'dashboard.html';" class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 hover:bg-white/20 transition-colors" aria-label="Close transaction history" title="Close">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-6 w-full min-w-0">
            <div class="bg-white rounded-lg shadow p-3 sm:p-5 min-w-0">
                <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-[11px] sm:text-sm text-slate-500 truncate">Total Income</p>
                        <p id="totalIncome" class="text-xs sm:text-2xl font-bold text-green-600 truncate">$0.00</p>
                    </div>
                    <div class="hidden sm:flex w-12 h-12 shrink-0 bg-green-100 rounded-full items-center justify-center">
                        <i class="fas fa-arrow-up text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-3 sm:p-5 min-w-0">
                <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-[11px] sm:text-sm text-slate-500 truncate">Total Expenses</p>
                        <p id="totalExpenses" class="text-xs sm:text-2xl font-bold text-red-600 truncate">$0.00</p>
                    </div>
                    <div class="hidden sm:flex w-12 h-12 shrink-0 bg-red-100 rounded-full items-center justify-center">
                        <i class="fas fa-arrow-down text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-3 sm:p-5 min-w-0">
                <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-[11px] sm:text-sm text-slate-500 truncate">Net Change</p>
                        <p id="netChange" class="text-xs sm:text-2xl font-bold text-slate-900 truncate whitespace-nowrap">$0.00</p>
                    </div>
                    <div class="hidden sm:flex w-12 h-12 shrink-0 bg-slate-100 rounded-full items-center justify-center">
                        <i class="fas fa-balance-scale text-slate-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Filter by Account</label>
                    <select id="filterAccount" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filterTransactions()">
                        <option value="">All Accounts</option>
                    </select>
                </div>
                <div class="md:w-48">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Transaction Type</label>
                    <select id="filterType" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="filterTransactions()">
                        <option value="">All Types</option>
                        <option value="transfer">Transfers</option>
                        <option value="deposit">Deposits</option>
                        <option value="withdrawal">Withdrawals</option>
                        <option value="external_in">External In</option>
                        <option value="external_out">External Out</option>
                    </select>
                </div>
                <div class="md:w-64">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Search</label>
                    <input type="text" id="searchTransaction" placeholder="Search transactions..." class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" onkeyup="filterTransactions()">
                </div>
            </div>
        </div>

        <!-- Transactions List -->
        <div class="bg-white rounded-lg shadow">
            <div class="p-6 border-b border-slate-200">
                <h2 class="text-xl font-semibold">Transactions</h2>
                <p class="text-sm text-slate-500 mt-1">Your complete transaction history</p>
            </div>
            <div id="transactionsList" class="divide-y divide-slate-200">
                <!-- Transaction items will be loaded here -->
            </div>
        </div>
    </main>

    <script src="js/api.js?v=20260121.1"></script>
    <script src="js/utils.js?v=20260121.1"></script>
    <script src="js/auth.js?v=20260121.1"></script>
    <script src="js/accounts-api.js?v=20260914.13"></script>
    <script src="js/transactions.js?v=20260914.12"></script>
    <script src="js/bottom-nav.js?v=20260121.1"></script>

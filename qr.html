<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Pay - American Bank United</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/opay.css">
  <link rel="icon" href="assets/abu-logo.png" type="image/png">
  <style>
    body{background:#f8fafc;color:#0f172a}
    .qr-page{max-width:520px;margin:0 auto;padding:0 16px 104px}
    .qr-topbar{display:flex;justify-content:flex-end;margin-bottom:12px}
    .qr-header-action{width:38px;height:38px;border:1px solid #e2e8f0;border-radius:999px;background:#fff;color:#64748b;display:flex;align-items:center;justify-content:center}
    .qr-hero{margin-bottom:18px}.qr-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;font-weight:700}.qr-hero h1{margin:4px 0 6px;font-size:26px;line-height:1.15}.qr-hero p{margin:0;color:#64748b;font-size:14px}
    .qr-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    .qr-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:#f1f5f9;border-radius:12px}.qr-tab{border:0;border-radius:9px;padding:10px 8px;background:transparent;color:#64748b;font-weight:700;cursor:pointer}.qr-tab.active{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(15,23,42,.08)}
    .qr-pane{margin-top:18px}.qr-scanner-shell{background:#0f172a;border-radius:14px;padding:10px;min-height:220px}.qr-scanner-shell #reader{border:0!important;border-radius:10px;overflow:hidden;background:#1e293b}.qr-helper{color:#64748b;font-size:13px;text-align:center;margin:12px 0 0}.qr-actions{display:flex;gap:8px;margin-top:14px}.qr-primary,.qr-secondary{flex:1;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.qr-primary{border:0;background:#0f172a;color:#fff}.qr-secondary{border:1px solid #cbd5e1;background:#fff;color:#334155}.qr-result{margin-top:14px;padding:12px;border-radius:10px;background:#f8fafc;color:#475569;font-size:13px;word-break:break-word}.qr-confirm{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.qr-confirm h2{margin:0;font-size:17px}.qr-confirm-details{margin-top:12px;color:#475569;font-size:14px;line-height:1.8}.qr-receive{text-align:center}.qr-code-frame{display:inline-flex;padding:16px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.06)}.qr-receive p{color:#64748b;font-size:13px;line-height:1.5;margin:14px 8px 0}
  </style>
</head>
<body class="opay-ui">
  <main class="qr-page">
    <div class="qr-topbar"><button type="button" onclick="location.href='dashboard.html'" class="qr-header-action" aria-label="Close QR Pay" title="Close"><i class="fas fa-xmark"></i></button></div>
    <section class="qr-hero"><div class="qr-eyebrow">ABU Payments</div><h1>QR Pay</h1><p>Scan a trusted code to pay, or show your QR code to receive funds.</p></section>
    <section class="qr-card">
      <div class="qr-tabs" role="tablist" aria-label="QR payment mode">
        <button id="scanTab" class="qr-tab active" role="tab" aria-selected="true">Scan to pay</button>
        <button id="showTab" class="qr-tab" role="tab" aria-selected="false">Receive money</button>
      </div>

      <div id="scanPane" class="qr-pane">
        <div class="qr-scanner-shell"><div id="reader" style="width:100%"></div></div>
        <p class="qr-helper">Position the payment QR code inside the frame.</p>
        <div class="qr-actions"><button id="startScan" class="qr-primary"><i class="fas fa-camera mr-2"></i>Start scanner</button><button id="stopScan" class="qr-secondary" style="display:none">Stop scanner</button></div>
        <div class="qr-actions"><button id="uploadQrButton" type="button" class="qr-secondary"><i class="fas fa-image mr-2" aria-hidden="true"></i>Upload QR image</button><input id="qrImageInput" type="file" accept="image/*" hidden></div>
        <div class="qr-result"><strong>Detected:</strong> <span id="scanResult">No scan yet</span></div>
      </div>

      <div id="confirmPane" class="qr-pane hidden qr-confirm">
        <h2>Confirm payment</h2>
        <div id="confirmDetails" class="qr-confirm-details"></div>
        <div class="qr-actions"><button id="confirmBtn" class="qr-primary">Continue to transfer</button><button id="cancelConfirmBtn" class="qr-secondary">Scan again</button></div>
      </div>

      <div id="showPane" class="qr-pane hidden qr-receive">
        <div class="qr-code-frame"><div id="myQrContainer"></div></div>
        <p>Share this code to receive funds directly into your primary American Bank United account.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/qr.js?v=20260926.1"></script>
  <script src="js/bottom-nav.js"></script>
</body>
</html>

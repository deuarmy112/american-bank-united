<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat - American Bank United</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .chat-list, .chat-window { background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(15, 23, 42, .08); }
        .chat-list { min-height: 560px; }
        .chat-window { min-height: 560px; display: flex; flex-direction: column; }
        .conversation { padding: 14px 16px; border-bottom: 1px solid #eef0f3; cursor: pointer; }
        .conversation.active, .conversation:hover { background: #f5f7fa; }
        .chat-messages { flex: 1; min-height: 400px; overflow-y: auto; padding: 20px; background: #f8fafc; }
        .chat-message { max-width: 75%; margin-bottom: 12px; }
        .chat-message.customer { margin-right: auto; }
        .chat-message.admin { margin-left: auto; text-align: right; }
        .chat-message span { display: inline-block; padding: 10px 12px; border-radius: 10px; text-align: left; }
        .chat-message.customer span { background: #fff; border: 1px solid #e5e7eb; }
        .chat-message.admin span { background: #1f2937; color: #fff; }
        @media (max-width: 760px) { .chat-layout { grid-template-columns: 1fr; } .chat-list { min-height: auto; max-height: 240px; overflow-y: auto; } .chat-window { min-height: 500px; } }
    </style>
</head>
<body>
    <nav class="navbar"><div class="container navbar-container"><div class="navbar-brand"><h2><img src="assets/abu-logo.png" alt="American Bank United" style="width: 150px; height: auto; display: block;"></h2></div><div class="navbar-menu">
        <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <a href="admin-users.html" class="nav-link"><i class="fas fa-users"></i> Users</a>
        <a href="admin-accounts.html" class="nav-link"><i class="fas fa-wallet"></i> Accounts</a>
        <a href="admin-transfer.html" class="nav-link"><i class="fas fa-paper-plane"></i> Transfer</a>
        <a href="admin-approvals.html" class="nav-link"><i class="fas fa-check-circle"></i> Approvals</a>
        <a href="admin-transactions.html" class="nav-link"><i class="fas fa-exchange-alt"></i> Transactions</a>
        <a href="admin-chat.html" class="nav-link active"><i class="fas fa-comments"></i> Chat</a>
        <a href="admin-notifications.html" class="nav-link"><i class="fas fa-bell"></i> Notifications</a>
        <a href="admin-settings.html" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
        <a href="admin-audit.html" class="nav-link"><i class="fas fa-history"></i> Audit Log</a>
        <div class="navbar-user"><span id="adminName"><i class="fas fa-user-shield"></i> Admin</span></div>
    </div></div></nav>
    <main class="container main-content"><div class="dashboard-header"><h1><i class="fas fa-comments"></i> Customer Chat</h1><p class="subtitle">Respond to customer support conversations</p></div>
        <div class="chat-layout"><section class="chat-list"><div style="padding:14px;border-bottom:1px solid #eef0f3;display:flex;gap:8px"><input id="userSearch" class="form-control" placeholder="Search customers..." aria-label="Search customers"><select id="userStatus" class="form-control" aria-label="Filter customers"><option value="active">Active</option><option value="">All statuses</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option></select></div><div id="conversationList"><p style="padding:20px;color:#6b7280">Loading customers...</p></div></section><section class="chat-window"><div id="chatHeader" style="padding:16px;border-bottom:1px solid #eef0f3;color:#6b7280">Select a customer to begin chat</div><div id="adminChatMessages" class="chat-messages"><p style="text-align:center;color:#9ca3af">Choose a customer to view messages.</p></div><form id="adminChatForm" style="display:flex;gap:10px;padding:16px;border-top:1px solid #eef0f3"><input id="adminChatInput" class="form-control" maxlength="2000" placeholder="Reply to customer..." disabled><label for="adminChatAttachment" style="padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;cursor:pointer" title="Attach a file"><i class="fas fa-paperclip"></i></label><input id="adminChatAttachment" type="file" hidden accept="image/*,application/pdf,application/json,text/plain,text/csv"><button class="btn btn-primary" type="submit" disabled id="adminChatSend"><i class="fas fa-paper-plane"></i> Send</button></form></section></div>
    </main>
    <script src="js/utils.js"></script><script src="js/admin-api.js"></script><script src="js/unread-badges.js"></script>
    <script>
        let selectedConversation = null;
        let selectedUser = null;
        let conversations = [];
        let chatRefreshBusy = false;
        const escapeText = value => String(value || '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
        function checkAuth() { const token = localStorage.getItem('adminAuthToken'); const admin = JSON.parse(localStorage.getItem('adminUser') || '{}'); if (!token || !['admin','super_admin'].includes(admin.role)) { location.href = 'admin-login.html'; return false; } document.getElementById('adminName').innerHTML = `<i class="fas fa-user-shield"></i> ${escapeText(admin.firstName || admin.first_name || 'Admin')}`; return true; }
        function renderConversations(users) { const list = document.getElementById('conversationList'); list.innerHTML = users.length ? users.map(user => { const conversation = conversations.find(item => item.id === user.id); const unread = Number(conversation?.admin_unread_count || 0); return `<div class="conversation ${selectedConversation === user.id ? 'active' : ''} ${unread ? 'font-bold' : ''}" data-id="${user.id}"><strong>${escapeText(`${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email)} ${unread ? `<span class="rounded-full bg-rose-500 text-white px-1.5 py-0.5 text-xs">${unread}</span>` : ''}</strong><div style="font-size:12px;color:#6b7280;margin-top:5px">${escapeText(conversation?.inquiry ? `${conversation.inquiry} - ` : '')}${escapeText(conversation?.last_message || user.email || 'Start a new chat')}</div></div>`; }).join('') : '<p style="padding:20px;color:#6b7280">No customers match this filter.</p>'; list.querySelectorAll('.conversation').forEach(item => item.addEventListener('click', () => { const user = users.find(customer => customer.id === item.dataset.id); const conversation = conversations.find(item => item.id === user.id); selectConversation(user.id, conversation || { id: user.id, user_name: `${user.first_name || ''} ${user.last_name || ''}`.trim(), user_email: user.email }); })); }
        function attachmentMarkup(message) { const attachment = message.attachment; if (!attachment?.data) return ''; const href = escapeText(attachment.data); const name = escapeText(attachment.name || 'Attached file'); const size = `${Math.max(1, Math.round(Number(attachment.size || 0) / 1024))} KB`; return `<a href="${href}" download="${name}" target="_blank" rel="noopener" style="display:block;margin-top:8px;text-decoration:underline">${name} <small>(${size})</small></a>`; }
        function renderMessages(messages) { const box = document.getElementById('adminChatMessages'); box.innerHTML = messages.length ? messages.map(message => `<div class="chat-message ${message.sender_role}"><span>${escapeText(message.text)}${attachmentMarkup(message)}<button type="button" data-delete-message="${escapeText(message.id)}" style="display:block;margin-top:8px;font-size:11px;text-decoration:underline">Remove</button></span><div style="font-size:10px;color:#9ca3af;margin-top:3px">${message.sender_role === 'admin' ? 'You' : 'Customer'}</div></div>`).join('') : '<p style="text-align:center;color:#9ca3af">No messages yet.</p>'; box.querySelectorAll('[data-delete-message]').forEach(button => button.addEventListener('click', async () => { if (!window.confirm('Remove this message and its attachment?')) return; button.disabled = true; try { await adminAPI.deleteChatMessage(selectedConversation, button.dataset.deleteMessage); await selectConversation(selectedConversation, selectedUser); } catch (error) { window.alert(error.message || 'Unable to remove message.'); button.disabled = false; } })); box.scrollTop = box.scrollHeight; }
        function readAttachment(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve({ name: file.name, type: file.type || 'application/octet-stream', size: file.size, data: reader.result }); reader.onerror = () => reject(new Error('Unable to read that file.')); reader.readAsDataURL(file); }); }
        async function selectConversation(id, conversation) { selectedConversation = id; selectedUser = conversation; document.getElementById('chatHeader').textContent = `${conversation.user_name || 'Customer'} ${conversation.user_email ? `(${conversation.user_email})` : ''}`; document.getElementById('adminChatInput').disabled = false; document.getElementById('adminChatSend').disabled = false; const data = await adminRequest(`${API_URL}/admin/chat/${encodeURIComponent(id)}`); renderMessages(data.messages || []); renderConversations(await loadUsers()); }
        async function loadUsers() { const data = await adminAPI.getUsers({ role: 'customer', status: document.getElementById('userStatus').value, search: document.getElementById('userSearch').value.trim(), limit: 200 }); return data.users || []; }
        async function loadConversations() { const data = await adminAPI.getChatConversations(); conversations = data.conversations || []; const users = await loadUsers(); renderConversations(users); }
        async function refreshChat() {
            if (chatRefreshBusy || document.visibilityState !== 'visible') return;
            chatRefreshBusy = true;
            try {
                await loadConversations();
                if (selectedConversation) {
                    const data = await adminRequest(`${API_URL}/admin/chat/${encodeURIComponent(selectedConversation)}`);
                    renderMessages(data.messages || []);
                }
            } catch (error) {
                console.warn('Chat refresh failed:', error);
            } finally {
                chatRefreshBusy = false;
            }
        }
        document.getElementById('userSearch').addEventListener('input', loadConversations);
        document.getElementById('userStatus').addEventListener('change', loadConversations);
        document.getElementById('adminChatForm').addEventListener('submit', async event => { event.preventDefault(); if (!selectedConversation) return; const input = document.getElementById('adminChatInput'); const fileInput = document.getElementById('adminChatAttachment'); const text = input.value.trim(); const file = fileInput.files[0]; if (!text && !file) return; if (file && file.size > 512 * 1024) return alert('Files must be 512 KB or smaller.'); input.disabled = true; try { await adminAPI.sendChatMessage(selectedConversation, text, file ? await readAttachment(file) : null); input.value = ''; fileInput.value = ''; await loadConversations(); await selectConversation(selectedConversation, selectedUser); } catch (error) { alert(error.message || 'Unable to send reply'); } finally { input.disabled = false; } });
        (async function init() { if (!checkAuth()) return; try { await loadConversations(); window.setInterval(refreshChat, 5000); } catch (error) { document.getElementById('conversationList').innerHTML = `<p style="padding:20px;color:#b91c1c">${escapeText(error.message)}</p>`; } })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beneficiaries - American Bank United</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/opay.css">
  <link rel="icon" href="assets/abu-logo.png" type="image/png">
  <style>
    :root{--navy:#111827;--ink:#172033;--muted:#64748b;--line:#dbe3ec;--panel:#fff;--bg:#f4f7fb}
    body{background:var(--bg);color:var(--ink)}.beneficiary-page{min-height:100vh;padding:20px 16px 44px}.beneficiary-shell{width:min(100%,760px);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.back-link{color:#475569;text-decoration:none;font-size:13px;font-weight:700}.topbar-logo{width:128px;height:auto}.hero{margin-bottom:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:32px;line-height:1.05;margin:6px 0 8px}.hero p{color:var(--muted);margin:0;max-width:560px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 13px}.primary{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;white-space:nowrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(15,23,42,.06)}.list{display:grid;gap:0}.beneficiary{display:flex;align-items:center;gap:14px;padding:17px 18px;border-bottom:1px solid #eef2f7}.beneficiary:last-child{border-bottom:0}.avatar{width:44px;height:44px;border-radius:13px;background:#e8eef5;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.beneficiary-main{min-width:0;flex:1}.beneficiary-name{font-weight:800}.beneficiary-meta{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.badge{font-size:11px;color:#475569;background:#f1f5f9;border-radius:999px;padding:5px 8px}.actions{display:flex;gap:7px}.icon-button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#475569;cursor:pointer}.empty{padding:40px 22px;text-align:center;color:var(--muted)}.empty i{font-size:28px;color:#94a3b8;margin-bottom:10px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.46);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(100%,460px);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(15,23,42,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.modal h2{font-size:19px;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#475569}.field input{border:1px solid var(--line);border-radius:9px;padding:11px}.modal-actions{display:flex;gap:9px;margin-top:18px}.secondary{flex:1;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;font-weight:700;color:#475569}.modal .primary{flex:1}@media(max-width:520px){.toolbar{align-items:stretch;flex-direction:column}.actions{margin-left:auto}.topbar-logo{width:112px}h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="beneficiary-page"><div class="beneficiary-shell">
    <div class="topbar"><a class="back-link" href="dashboard.html"><i class="fas fa-arrow-left"></i> Dashboard</a><img class="topbar-logo" src="assets/abu-logo.png" alt="American Bank United"></div>
    <section class="hero"><div class="eyebrow">Payments</div><h1>Beneficiaries</h1><p>Save trusted recipients once and send transfers faster next time.</p></section>
    <div class="toolbar"><input id="search" class="search" type="search" placeholder="Search by name or bank" aria-label="Search beneficiaries"><button id="addButton" class="primary" type="button"><i class="fas fa-plus"></i> Add beneficiary</button></div>
    <section class="panel"><div id="list" class="list"><div class="empty">Loading beneficiaries...</div></div></section>
  </div></main>
  <div id="modalBackdrop" class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Add beneficiary</h2><button id="closeButton" class="close" type="button" aria-label="Close"><i class="fas fa-xmark"></i></button></div><form id="form"><input id="editingId" type="hidden"><div class="field"><label for="name">Beneficiary name</label><input id="name" required></div><div class="field"><label for="accountNumber">Account number or IBAN</label><input id="accountNumber" required></div><div class="field"><label for="bankName">Bank name</label><input id="bankName" required></div><div class="field"><label for="email">Email (optional)</label><input id="email" type="email"></div><div class="field"><label for="phone">Phone (optional)</label><input id="phone" type="tel"></div><div class="modal-actions"><button id="cancelButton" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Save beneficiary</button></div></form></section></div>
  <script src="js/api.js"></script>
  <script>
    const list = document.getElementById('list'); const search = document.getElementById('search'); const backdrop = document.getElementById('modalBackdrop'); const form = document.getElementById('form'); let beneficiaries = [];
    const escapeText = value => String(value || '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
    const initials = name => String(name || 'B').split(/\s+/).slice(0,2).map(part => part[0]).join('').toUpperCase();
    const mask = value => { const text = String(value || ''); return text ? `${'*'.repeat(Math.max(0,text.length - 4))}${text.slice(-4)}` : 'Account not provided'; };
    function render(){ const query=search.value.trim().toLowerCase(); const rows=beneficiaries.filter(item=>[item.name,item.bank_name,item.nickname].join(' ').toLowerCase().includes(query)); list.innerHTML=rows.length?rows.map(item=>`<article class="beneficiary"><div class="avatar">${escapeText(initials(item.name))}</div><div class="beneficiary-main"><div class="beneficiary-name">${escapeText(item.nickname || item.name)}</div><div class="beneficiary-meta">${escapeText(item.bank_name)} · ${escapeText(mask(item.account_number))}${item.email?` · ${escapeText(item.email)}`:''}</div></div><span class="badge">External</span><div class="actions"><button class="icon-button" data-edit="${escapeText(item.id)}" title="Edit"><i class="fas fa-pen"></i></button><button class="icon-button" data-delete="${escapeText(item.id)}" title="Remove"><i class="fas fa-trash"></i></button></div></article>`).join(''):'<div class="empty"><i class="fas fa-address-book"></i><div>No beneficiaries yet</div><small>Add a recipient after a successful external or international transfer.</small></div>'; list.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>openForm(beneficiaries.find(item=>item.id===button.dataset.edit)))); list.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',()=>removeBeneficiary(button.dataset.delete))); }
    async function load(){ try{ const data=await apiClient.get('/beneficiaries'); beneficiaries=data; render(); }catch(error){ list.innerHTML=`<div class="empty">${escapeText(error.message || 'Unable to load beneficiaries.')}</div>`; } }
    function openForm(item){ form.reset(); document.getElementById('editingId').value=item?.id||''; document.getElementById('modalTitle').textContent=item?'Edit beneficiary':'Add beneficiary'; if(item){['name','accountNumber','bankName','email','phone'].forEach(key=>document.getElementById(key).value=item[key==='accountNumber'?'account_number':key==='bankName'?'bank_name':key]||'');} backdrop.classList.add('open'); document.getElementById('name').focus(); }
    function closeForm(){backdrop.classList.remove('open');}
    async function removeBeneficiary(id){if(!confirm('Remove this beneficiary?'))return;try{await apiClient.delete(`/beneficiaries/${encodeURIComponent(id)}`);await load();}catch(error){alert(error.message||'Unable to remove beneficiary.');}}
    form.addEventListener('submit',async event=>{event.preventDefault();const id=document.getElementById('editingId').value;const payload={name:document.getElementById('name').value.trim(),accountNumber:document.getElementById('accountNumber').value.trim(),bankName:document.getElementById('bankName').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim()};try{if(id)await apiClient.request(`/beneficiaries/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(payload)});else await apiClient.post('/beneficiaries',payload);closeForm();await load();}catch(error){alert(error.message||'Unable to save beneficiary.');}});
    search.addEventListener('input',render); document.getElementById('addButton').addEventListener('click',()=>openForm()); document.getElementById('closeButton').addEventListener('click',closeForm); document.getElementById('cancelButton').addEventListener('click',closeForm); backdrop.addEventListener('click',event=>{if(event.target===backdrop)closeForm();}); load();
  </script>
</body>
</html>
